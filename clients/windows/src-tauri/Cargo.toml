[package]
name = "xiayun-windows"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "匣雲 Windows 桌面客戶端"
authors = ["匣雲"]
publish = false

[lib]
name = "xiayun_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "xiayun"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
xiayun-core = { path = "../crates/xiayun-core" }
